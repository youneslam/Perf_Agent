[project]
name = "perf-agent"
version = "0.1.0"
description = "LLM agent that iteratively optimizes the performance of one Java component, keeping each accepted improvement as a full version folder."
readme = "README.md"
authors = [
    { name = "younes lamnouar", email = "younes.lamnouar03@gmail.com" }
]
requires-python = ">=3.11"
dependencies = [
    "langchain>=1.0,<2",
    "langchain-anthropic>=1.7.6",
    "langchain-core>=1.0,<2",
    "langchain-ollama>=1.1.0",
    "langchain-openai>=1.7.3",
    "langgraph>=1.0,<2",
    "langgraph-checkpoint-sqlite>=3.1.2",
    "neo4j>=6.4.1",
    "pydantic>=2",
    "python-dotenv>=1.2.4",
    "pyyaml>=6.0.3",
    "rich>=15.0.0",
    "typer>=0.27.3",
]

[project.scripts]
perf-agent = "perf_agent.cli:app"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["perf_agent"]

[tool.pytest.ini_options]
testpaths = ["tests"]
markers = [
  "neo4j: needs a running Neo4j",
  "live: calls a real LLM API (costs money)",
]
addopts = "-m 'not live and not neo4j'"

[tool.mypy]
strict = true
plugins = ["pydantic.mypy"]

[tool.ruff]
line-length = 100
target-version = "py311"

[dependency-groups]
dev = [
    "mypy>=2.4.0",
    "pytest>=9.1.1",
    "pytest-cov>=7.1.0",
    "ruff>=0.17.3",
    "types-pyyaml>=6.0.12.20260906",
]
